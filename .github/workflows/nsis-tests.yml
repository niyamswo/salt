---
name: Test NSIS Installer

on:
  workflow_call:
    inputs:
      changed-files:
        required: true
        type: string
        description: JSON string containing information about changed files
      full:
        required: true
        type: boolean
        description: Is this a full testrun or not
      ci-python-version:
        required: true
        type: string
        description: The version of python to use for the workflow run


jobs:
  Test-NSIS-Logic:
    name: Logic Tests
    runs-on:
      - windows-latest
    if: ${{ inputs.full || contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) || fromJSON(inputs.changed-files)['nsis_tests'] }}

    steps:

    - name: Checkout Salt
      uses: actions/checkout@v4

    - name: Set Up Python ${{ inputs.ci-python-version }}
      uses: actions/setup-python@v5
      if: matrix.arch != 's390x' && runner.arch != 's390x'
      with:
        python-version: "${{ inputs.ci-python-version }}"

    - name: Install Python on s390x (APT)
      if: matrix.arch == 's390x' || runner.arch == 's390x'
      run: |
        sudo ln -sf /usr/bin/python3.10 /usr/bin/python3
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3.11 python3.11-venv python3-pip
        sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1 || true
        python3 --version
    - name: Install NSIS
      run: .\pkg\windows\install_nsis.cmd -CICD
      shell: cmd

    - name: Build Test Installer
      run: .\pkg\windows\nsis\tests\setup.cmd -CICD
      shell: cmd

    - name: Run Config Tests
      run: .\pkg\windows\nsis\tests\test.cmd -CICD .\config_tests
      shell: cmd

  Test-NSIS-Stress:
    name: Stress Tests
    runs-on:
      - windows-latest
    if: ${{ inputs.full || contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) || fromJSON(inputs.changed-files)['nsis_tests'] }}

    steps:

      - name: Checkout Salt
        uses: actions/checkout@v4

      - name: Set Up Python ${{ inputs.ci-python-version }}
        uses: actions/setup-python@v5
        if: matrix.arch != 's390x' && runner.arch != 's390x'
        with:
          python-version: "${{ inputs.ci-python-version }}"

      - name: Install Python on s390x (APT)
        if: matrix.arch == 's390x' || runner.arch == 's390x'
        run: |
          # Fix apt_pkg before running apt-get (restores python3.10 if broken)
          sudo ln -sf /usr/bin/python3.10 /usr/bin/python3 || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3.11 python3.11-venv python3-pip
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 2 || true
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1 || true
          sudo update-alternatives --set python3 /usr/bin/python3.10 || true
          # python3.11 is available explicitly; keep system python3 -> 3.10 so apt_pkg keeps working
          python3.11 --version
          python3 --version
      - name: Install NSIS
        run: .\pkg\windows\install_nsis.cmd -CICD
        shell: cmd

      - name: Build Test Installer
        run: .\pkg\windows\nsis\tests\setup.cmd -CICD
        shell: cmd

      - name: Run Stress Test
        run: .\pkg\windows\nsis\tests\test.cmd -CICD .\stress_tests
        shell: cmd
