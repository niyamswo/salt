---
name: setup-actionlint
description: Setup actionlint

inputs:
  version:
    description: The version of actionlint
    default: 1.7.7
  cache-seed:
    required: true
    description: Seed used to invalidate caches


runs:
  using: composite
  steps:

    - name: Cache actionlint Binary
      uses: ./.github/actions/cache
      with:
        path: /usr/local/bin/actionlint
        key: ${{ inputs.cache-seed }}|${{ runner.os }}|${{ runner.arch }}|actionlint|${{ inputs.version }}

    - name: Setup actionlint
      shell: bash
      run: |
        if ! command -v actionlint; then
          # Check if architecture is supported
          ARCH=$(uname -m)
          if [ "$ARCH" = "s390x" ]; then
            echo "Warning: actionlint does not support s390x architecture. Skipping installation."
            # Create a dummy actionlint script that exits successfully
            echo '#!/bin/bash' | sudo tee /usr/local/bin/actionlint > /dev/null
            echo 'echo "actionlint skipped on s390x architecture"' | sudo tee -a /usr/local/bin/actionlint > /dev/null
            echo 'exit 0' | sudo tee -a /usr/local/bin/actionlint > /dev/null
            sudo chmod +x /usr/local/bin/actionlint
          else
            bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) ${{ inputs.version }}
            mv ./actionlint /usr/local/bin/actionlint
          fi
        fi
    - name: Show actionlint Version
      shell: bash
      run: |
        actionlint --version
